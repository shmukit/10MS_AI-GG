name: Code Quality Audit
on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-corepack: true
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (Static Audit)
        run: npm run lint
        continue-on-error: true

      - name: Logic Duplication Check
        run: npx jscpd src --threshold 10 # Fails if >10% duplication
