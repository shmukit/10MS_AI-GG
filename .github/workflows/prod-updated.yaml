name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Get Branch and SHA
        id: vars
        shell: bash
        run: |
          echo "tag=${GITHUB_REF#refs/heads/}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "SHA: $(git rev-parse --short HEAD)"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "Building Docker image..."
          docker build . --file dockerfile -t $ECR_REGISTRY/tenms-ai-gg:$IMAGE_TAG \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/tenms-ai-gg:$IMAGE_TAG
          
          echo "Image pushed: $ECR_REGISTRY/tenms-ai-gg:$IMAGE_TAG"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

      - name: Deploy to AKS Cluster
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "Deploying to AKS cluster..."
          kubectl set image --record deployment/tenms-ai-gg tenms-ai-gg=$ECR_REGISTRY/tenms-ai-gg:$IMAGE_TAG
          
          echo "Checking deployment status..."
          kubectl rollout status deployment/tenms-ai-gg
          
          echo "Deployment completed successfully!"
