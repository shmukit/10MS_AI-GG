name: Docker Image CI

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v2
      - name: Get Branch and SHA
        id: vars
        shell: bash
        run: |
          echo "::set-output name=tag::${GITHUB_REF#refs/heads/}-$(git rev-parse --short HEAD)"
          echo "secret ${{secrets.CLUSTER_NAME}}"
          echo "env ${{env.CLUSTER_NAME}}"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Api Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
        run: |
          docker build . --file dockerfile -t $ECR_REGISTRY/tenms-ai-gg:${{ steps.vars.outputs.tag }} --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} --build-arg AWS_DEFAULT_REGION=ap-southeast-1
          docker push $ECR_REGISTRY/tenms-ai-gg:${{ steps.vars.outputs.tag }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

      - name: Deploy to AKS Cluster
        run: |
          kubectl set image --record deployment/tenms-ai-gg tenms-ai-gg=${{ secrets.AWS_ECR_REGISTRY }}/tenms-ai-gg:${{ steps.vars.outputs.tag }}