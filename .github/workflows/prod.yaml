name: Docker Image CI

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-1
  DEPLOY_IMAGE_NAME: tenms-ai-gg
  SSM_PARAM_NAME: prod-tenms-ai-gg
  K8S_DEPLOYMENT_NAME: tenms-ai-gg
  K8S_CONTAINER_NAME: tenms-ai-gg

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v2
      - name: Get Branch and SHA
        id: vars
        shell: bash
        run: |
          echo "tag=${GITHUB_REF#refs/heads/}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Configure AWS credentials
        if: github.repository == 'tenminschool/10MS_AI-GG'
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.repository == 'tenminschool/10MS_AI-GG'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Api Build, tag, and push image to Amazon ECR
        if: github.repository == 'tenminschool/10MS_AI-GG'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          IMAGE_NAME: ${{ env.DEPLOY_IMAGE_NAME }}
          SSM_PARAM_NAME: ${{ env.SSM_PARAM_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          docker build . --file dockerfile -t $ECR_REGISTRY/$IMAGE_NAME:${{ steps.vars.outputs.tag }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_DEFAULT_REGION=$AWS_REGION \
            --build-arg SSM_PARAM_NAME=$SSM_PARAM_NAME \
            --build-arg AWS_SSM_REGION=$AWS_REGION
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ steps.vars.outputs.tag }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

      - name: Deploy to AKS Cluster
        if: github.repository == 'tenminschool/10MS_AI-GG'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          IMAGE_NAME: ${{ env.DEPLOY_IMAGE_NAME }}
          DEPLOYMENT_NAME: ${{ env.K8S_DEPLOYMENT_NAME }}
          CONTAINER_NAME: ${{ env.K8S_CONTAINER_NAME }}
        run: |
          kubectl set image --record deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$ECR_REGISTRY/$IMAGE_NAME:${{ steps.vars.outputs.tag }}