name: Secret Scanning (Gitleaks)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz gitleaks
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Scanning PR commits only (range: origin/${{ github.base_ref }}..HEAD)"
            ./gitleaks detect --config=.gitleaks.toml --verbose --redact --log-opts="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "Scanning single commit on new branch..."
              ./gitleaks detect --config=.gitleaks.toml --verbose --redact --log-opts="-1"
            else
              echo "Scanning push commit range (range: ${{ github.event.before }}..${{ github.event.after }})"
              ./gitleaks detect --config=.gitleaks.toml --verbose --redact --log-opts="${{ github.event.before }}..${{ github.event.after }}"
            fi
          else
            echo "Scanning full repository workspace..."
            ./gitleaks detect --config=.gitleaks.toml --verbose --redact
          fi
