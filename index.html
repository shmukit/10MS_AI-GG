<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheSTEM AI-GG Interactive Roadmap Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

  <!-- Optimize loading with DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />

  <!-- Critical CSS inlined for faster first paint -->
  <style>
    /* Critical CSS for loading spinner */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Prevent layout shift */
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Basic body styles to prevent flash */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Fallback loading content -->
    <div
      style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column;">
      <div class="loading-spinner"></div>
      <p style="margin-top: 1rem; color: #666;">Loading SheSTEM...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
